[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schiffer"
version = "0.4.1"
description = "MCP server that steers photo apps on macOS: Capture One via AppleScript, and file metadata (ratings, labels, keywords, IPTC, renaming) via ExifTool."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeton Kacaniku" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<3", "pillow>=10", "numpy>=1.24", "pypdfium2>=4.20"]
keywords = ["mcp", "capture-one", "photography", "applescript", "exiftool", "xmp", "iptc", "automation", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/jetcccn/schiffer-mcp"
Issues = "https://github.com/jetcccn/schiffer-mcp/issues"

[project.scripts]
schiffer = "schiffer.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schiffer"]
